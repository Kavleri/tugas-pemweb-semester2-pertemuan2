<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 02 PHP Form Processing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Praktikum 02 - PHP Form Processing</h1>

        <!-- Form Nilai (GET Request) -->
        <section id="formNilai" class="mt-4">
            <h2>Form Nilai (GET Request)</h2>
            <form action="nilai_get.php" method="GET" class="card p-4 mt-3">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama" required>
                </div>
                <div class="mb-3">
                    <label for="matkul" class="form-label">Mata Kuliah</label>
                    <input type="text" class="form-control" id="matkul" name="matkul" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_uts" class="form-label">Nilai UTS</label>
                    <input type="number" class="form-control" id="nilai_uts" name="nilai_uts" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_uas" class="form-label">Nilai UAS</label>
                    <input type="number" class="form-control" id="nilai_uas" name="nilai_uas" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_tugas" class="form-label">Nilai Tugas</label>
                    <input type="number" class="form-control" id="nilai_tugas" name="nilai_tugas" required>
                </div>
                <button type="submit" class="btn btn-primary">Proses</button>
            </form>
        </section>

        <!-- Form Belanja (POST Request) -->
        <section id="formBelanja" class="mt-5">
            <h2>Form Belanja (POST Request)</h2>
            <form action="belanja_post.php" method="POST" class="card p-4 mt-3">
                <div class="mb-3">
                    <label for="customer" class="form-label">Customer</label>
                    <input type="text" class="form-control" id="customer" name="customer" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Produk Pilihan</label>
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="produk" value="TV" id="tv" required>
                            <label class="form-check-label" for="tv">TV</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="produk" value="Kulkas" id="kulkas" required>
                            <label class="form-check-label" for="kulkas">Kulkas</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="produk" value="Mesin Cuci" id="mesincuci" required>
                            <label class="form-check-label" for="mesincuci">Mesin Cuci</label>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="jumlah" class="form-label">Jumlah Beli</label>
                    <input type="number" class="form-control" id="jumlah" name="jumlah" required>
                </div>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
        </section>

        <!-- Form Nilai (POST Request) -->
        <section id="formNilaiPost" class="mt-5">
            <h2>Form Nilai (POST Request dengan Logika)</h2>
            <form action="nilai_post.php" method="POST" class="card p-4 mt-3">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama" required>
                </div>
                <div class="mb-3">
                    <label for="matkul" class="form-label">Mata Kuliah</label>
                    <input type="text" class="form-control" id="matkul" name="matkul" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_uts" class="form-label">Nilai UTS</label>
                    <input type="number" class="form-control" id="nilai_uts" name="nilai_uts" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_uas" class="form-label">Nilai UAS</label>
                    <input type="number" class="form-control" id="nilai_uas" name="nilai_uas" required>
                </div>
                <div class="mb-3">
                    <label for="nilai_tugas" class="form-label">Nilai Tugas</label>
                    <input type="number" class="form-control" id="nilai_tugas" name="nilai_tugas" required>
                </div>
                <button type="submit" class="btn btn-primary">Proses</button>
            </form>
        </section>
    </div>
</body>
</html>
